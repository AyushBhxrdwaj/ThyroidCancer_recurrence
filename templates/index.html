<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Thyroid Cancer Recurrence Predictor</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <div class="container">
      <div class="form-header">
        <span class="form-logo">&#9878;</span>
        <h2>Thyroid Cancer Recurrence Predictor</h2>
        <p class="form-subtitle">
          Enter patient details below and our AI model will predict the
          likelihood of thyroid cancer recurrence.
        </p>
      </div>

      {% if error %}
      <div class="error-banner">{{ error }}</div>
      {% endif %}

      <form action="/report" method="post">
        <label for="Age">Age</label>
        <input
          type="number"
          name="Age"
          id="Age"
          placeholder="e.g. 45"
          required
        />

        <label for="Gender">Gender</label>
        <select name="Gender" id="Gender" required>
          <option value="" disabled selected>Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>

        <label for="Risk">Risk Level</label>
        <select name="Risk" id="Risk" required>
          <option value="" disabled selected>Select Risk Level</option>
          <option value="Low">Low Risk</option>
          <option value="Intermediate">Intermediate Risk</option>
          <option value="High">High Risk</option>
        </select>

        <button type="submit">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="vertical-align: middle; margin-right: 4px"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          Predict Recurrence
        </button>
      </form>
    </div>
  </body>
</html>
